services:
    laravel.test:
        build:
            context: ./docker/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: "${WWWGROUP}"
                MYSQL_CLIENT: mariadb-client
        image: sail-8.4/app
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "${APP_PORT:-80}:80"
            - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
            - "${REVERB_SERVER_PORT:-8080}:8080"
        environment:
            WWWUSER: "${WWWUSER}"
            LARAVEL_SAIL: 1
            XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
            XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
            IGNITION_LOCAL_SITES_PATH: "${PWD}"
        volumes:
            - ".:/var/www/html"
        networks:
            - sail
        depends_on:
            - mariadb
            - redis
            - mailpit
            - selenium
            - rustfs
    rustfs:
        image: "rustfs/rustfs:1.0.4"
        ports:
            - "${FORWARD_RUSTFS_PORT:-9000}:9000"
            - "${FORWARD_RUSTFS_CONSOLE_PORT:-9001}:9001"
        environment:
            RUSTFS_ACCESS_KEY: "${AWS_ACCESS_KEY_ID}"
            RUSTFS_SECRET_KEY: "${AWS_SECRET_ACCESS_KEY}"
            RUSTFS_ADDRESS: ":9000"
            RUSTFS_CONSOLE_ADDRESS: ":9001"
            RUSTFS_CONSOLE_ENABLE: "true"
        volumes:
            - "sail-rustfs:/data"
        networks:
            - sail
        healthcheck:
            test:
                - CMD-SHELL
                - "curl -f http://localhost:9000/health || exit 1"
            retries: 3
            timeout: 5s
    rustfs-init:
        image: "amazon/aws-cli:2.38.5"
        depends_on:
            rustfs:
                condition: service_healthy
        restart: "no"
        environment:
            AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
            AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
            AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
            AWS_BUCKET: "${AWS_BUCKET:-regrowth}"
        volumes:
            - "./docker/rustfs/public-read-policy.json:/policy.json:ro"
        networks:
            - sail
        entrypoint:
            - /bin/sh
            - -c
            - |
              aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$AWS_BUCKET" || aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$AWS_BUCKET" || exit 1
              sed "s/__BUCKET__/$$AWS_BUCKET/g" /policy.json > /tmp/policy.json
              aws --endpoint-url http://rustfs:9000 s3api put-bucket-policy --bucket "$$AWS_BUCKET" --policy file:///tmp/policy.json
    mysql:
        image: "mysql/mysql-server:8.0"
        profiles: [legacy]
        ports:
            - "${FORWARD_MYSQL_PORT:-33060}:3306"
        environment:
            MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
            MYSQL_ROOT_HOST: "%"
            MYSQL_DATABASE: "${DB_DATABASE}"
            MYSQL_USER: "${DB_USERNAME}"
            MYSQL_PASSWORD: "${DB_PASSWORD}"
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: "${MYSQL_EXTRA_OPTIONS}"
        volumes:
            - "sail-mysql:/var/lib/mysql"
            - "./vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh"
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - "-p${DB_PASSWORD}"
            retries: 3
            timeout: 5s
    redis:
        image: "redis:alpine"
        ports:
            - "${FORWARD_REDIS_PORT:-6379}:6379"
        volumes:
            - "sail-redis:/data"
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        image: "axllent/mailpit:latest"
        ports:
            - "${FORWARD_MAILPIT_PORT:-1025}:1025"
            - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
        networks:
            - sail
    selenium:
        image: selenium/standalone-chromium
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - "/dev/shm:/dev/shm"
        networks:
            - sail
    mariadb:
        image: "mariadb:11"
        ports:
            - "${FORWARD_DB_PORT:-3306}:3306"
        environment:
            MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
            MYSQL_ROOT_HOST: "%"
            MYSQL_DATABASE: "${DB_DATABASE}"
            MYSQL_USER: "${DB_USERNAME}"
            MYSQL_PASSWORD: "${DB_PASSWORD}"
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        volumes:
            - "sail-mariadb:/var/lib/mysql"
            - "./vendor/laravel/sail/database/mariadb/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh"
            - "./docker/mariadb/create-sandbox-database.sh:/docker-entrypoint-initdb.d/11-create-sandbox-database.sh"
            - "./docker/mariadb/my.cnf:/etc/mysql/conf.d/99-logging.cnf:ro"
            - "sail-mariadb-logs:/var/log/mysql"
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - healthcheck.sh
                - "--connect"
                - "--innodb_initialized"
            retries: 3
            timeout: 5s
    meilisearch:
        image: "getmeili/meilisearch:latest"
        profiles: [unused]
        ports:
            - "${FORWARD_MEILISEARCH_PORT:-7700}:7700"
        environment:
            MEILI_NO_ANALYTICS: "${MEILISEARCH_NO_ANALYTICS:-false}"
        volumes:
            - "sail-meilisearch:/meili_data"
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - wget
                - "--no-verbose"
                - "--spider"
                - "http://127.0.0.1:7700/health"
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-mysql-logs:
        driver: local
    sail-redis:
        driver: local
    sail-mariadb:
        driver: local
    sail-mariadb-logs:
        driver: local
    sail-meilisearch:
        driver: local
    sail-rustfs:
        driver: local
